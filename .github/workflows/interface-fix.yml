name: Apply VOLEY interface refinements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app behavior and interface
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text(encoding='utf-8')

          old = '''          className={value === key ? "active" : ""}\n          onClick={() => onChange(key)}'''
          new = '''          className={value === key ? "active" : ""}\n          onClick={() => onChange(value === key ? "" : key)}'''
          if old not in text:
              raise SystemExit('ActivityPicker target not found')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          css = Path('src/styles.css')
          extra = r'''

/* =========================================================
   MGSM VOLEY — INTERFAZ VISUAL FINAL
   Basada en la referencia Interfaz.png y el logo oficial Logo.jpg
========================================================= */

:root {
  --mgsm-red: #b5121b;
  --mgsm-red-dark: #8d0d14;
  --mgsm-black: #111111;
  --mgsm-ink: #1f1f1f;
  --mgsm-soft: #f5f5f5;
  --mgsm-line: #e5e5e5;
}

body {
  background:
    radial-gradient(circle at 100% 0%, rgba(181,18,27,.08), transparent 28%),
    linear-gradient(180deg, #fafafa 0%, #f3f4f6 100%);
}

.auth {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(135deg, rgba(17,17,17,.97), rgba(181,18,27,.94)),
    #111;
}

.auth::before {
  content: "";
  position: absolute;
  width: 430px;
  height: 430px;
  right: -170px;
  top: -150px;
  border-radius: 50%;
  background: url("https://raw.githubusercontent.com/Mariano-Solis/asistencia-voley/main/Logo.jpg") center/cover no-repeat;
  opacity: .10;
  filter: grayscale(1) brightness(2);
}

.auth-card {
  position: relative;
  z-index: 1;
  max-width: 460px;
  padding: 34px 30px 30px;
  border: 0;
  border-radius: 24px;
  background: rgba(255,255,255,.98);
  box-shadow: 0 30px 80px rgba(0,0,0,.28);
}

.auth-card::before {
  content: "";
  display: block;
  height: 6px;
  margin: -34px -30px 28px;
  border-radius: 24px 24px 0 0;
  background: linear-gradient(90deg, var(--mgsm-black) 0 18%, var(--mgsm-red) 18% 82%, var(--mgsm-black) 82%);
}

.ball {
  width: 104px;
  height: 104px;
  margin: 0 auto 20px;
  border: 5px solid var(--mgsm-red);
  background: #fff url("https://raw.githubusercontent.com/Mariano-Solis/asistencia-voley/main/Logo.jpg") center/82% no-repeat;
  box-shadow: 0 12px 30px rgba(181,18,27,.18);
  font-size: 0;
}

.auth-card h1 {
  font-size: 25px;
  color: var(--mgsm-black);
}

.brand-tagline {
  color: var(--mgsm-red) !important;
  letter-spacing: .04em;
}

.auth-card form button,
.save-btn,
.category-create-form button {
  background: var(--mgsm-red);
  box-shadow: 0 7px 18px rgba(181,18,27,.20);
}

.auth-card form button:hover,
.save-btn:hover,
.category-create-form button:hover {
  background: var(--mgsm-red-dark);
}

.app {
  background: #f4f5f6;
}

.app > header {
  height: 78px;
  padding: 0 30px;
  background: var(--mgsm-black);
  border-bottom: 4px solid var(--mgsm-red);
  color: #fff;
  box-shadow: 0 5px 18px rgba(0,0,0,.12);
}

.brand {
  color: #fff;
  gap: 12px;
  font-size: 20px;
}

.brand::before {
  content: "";
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  border-radius: 50%;
  background: #fff url("https://raw.githubusercontent.com/Mariano-Solis/asistencia-voley/main/Logo.jpg") center/cover no-repeat;
  box-shadow: 0 0 0 2px rgba(255,255,255,.18);
}

.brand:first-letter { font-size: 0; }

.header-user { color: #fff; }

.logout {
  border-color: rgba(255,255,255,.22);
  background: rgba(255,255,255,.08);
  color: #fff;
}

.logout:hover {
  background: var(--mgsm-red);
  color: #fff;
}

.app > nav {
  flex-wrap: nowrap;
  white-space: nowrap;
  overflow-x: auto;
  padding: 12px 30px;
  background: #fff;
  box-shadow: 0 2px 10px rgba(0,0,0,.04);
}

.app > nav button {
  flex: 0 0 auto;
  min-width: max-content;
  border: 1px solid transparent;
  border-radius: 9px;
}

.app > nav button.active {
  background: var(--mgsm-red);
  color: #fff;
  box-shadow: 0 5px 12px rgba(181,18,27,.18);
}

.app > nav button:hover {
  background: #f3f3f3;
  color: var(--mgsm-red);
}

.content {
  max-width: 1180px;
  padding-top: 30px;
}

.page-head h2 {
  color: var(--mgsm-black);
  font-weight: 900;
}

.filter-box,
.history-detail,
.code-card,
.simple-row,
.player-row,
.permission-group {
  border-color: var(--mgsm-line);
  box-shadow: 0 6px 18px rgba(0,0,0,.045);
}

.filter-box {
  border-top: 4px solid var(--mgsm-red);
}

.activity-picker button.active,
.category-picker-options button.selected,
.status-picker .status.active {
  background: var(--mgsm-red);
  border-color: var(--mgsm-red);
  color: #fff;
}

.activity-picker button:hover,
.category-picker-options button:hover {
  border-color: #d6d6d6;
}

.status.present.active { background: #138a4b; border-color: #138a4b; color: #fff; }
.status.late.active { background: #c77800; border-color: #c77800; color: #fff; }
.status.absent.active { background: var(--mgsm-red); border-color: var(--mgsm-red); color: #fff; }

.permission-group-head {
  background: var(--mgsm-black);
  color: #fff;
}

.permission-group-head strong { color: #fff; }

.delete-btn { color: var(--mgsm-red) !important; }

.detail-back { color: var(--mgsm-red); font-weight: 800; }

.session:hover {
  border-color: rgba(181,18,27,.35);
  box-shadow: 0 6px 18px rgba(181,18,27,.08);
}

/* Click the same activity again to contract its extra fields. */
.activity-picker button.active::after {
  content: " · abierto";
  font-size: 10px;
  opacity: .75;
}

@media (max-width: 800px) {
  .app > header { padding: 0 16px; }
  .app > nav {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding: 9px 12px;
  }
  .app > nav button { flex: 0 0 auto; min-width: max-content; }
  .brand { font-size: 16px; }
  .brand::before { width: 42px; height: 42px; flex-basis: 42px; }
}

@media (max-width: 620px) {
  .auth-card { padding: 30px 20px 24px; }
  .auth-card::before { margin: -30px -20px 24px; }
  .app > nav { justify-content: flex-start; }
  .app > nav button { font-size: 12px; padding: 9px 12px; }
}
'''
          current = css.read_text(encoding='utf-8')
          if 'MGSM VOLEY — INTERFAZ VISUAL FINAL' not in current:
              css.write_text(current + extra, encoding='utf-8')

      - name: Commit refinements and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css
          git rm .github/workflows/interface-fix.yml
          git commit -m "feat: refine VOLEY interface and collapsible activities"
          git push
