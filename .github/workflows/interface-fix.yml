name: Interface fixes

on:
  push:
    paths:
      - '.github/workflows/interface-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          app = Path('src/App.jsx')
          text = app.read_text(encoding='utf-8')

          old = '''function ActivityPicker({ value, onChange }) {
            return (
              <div className="activity-picker">
                {Object.entries(ACTIVITY_TYPES).map(([key, item]) => (
                  <button
                    key={key}
                    type="button"
                    className={value === key ? "active" : ""}
                    onClick={() => onChange(key)}
                  >
                    {item.icon} {item.label}
                  </button>
                ))}
              </div>
            );
          }'''
          new = '''function ActivityPicker({ value, onChange, open, onToggle }) {
            return (
              <div className="activity-picker">
                {Object.entries(ACTIVITY_TYPES).map(([key, item]) => (
                  <button
                    key={key}
                    type="button"
                    className={value === key ? "active" : ""}
                    aria-expanded={value === key ? open : false}
                    onClick={() => {
                      if (value === key) {
                        onToggle();
                        return;
                      }
                      onChange(key);
                    }}
                  >
                    {item.icon} {item.label}
                  </button>
                ))}
              </div>
            );
          }'''
          if old not in text:
              raise SystemExit('ActivityPicker block not found')
          text = text.replace(old, new, 1)

          old = '''  const [activityType, setActivityType] = useState("training");
  const [attendance, setAttendance] = useState({});'''
          new = '''  const [activityType, setActivityType] = useState("training");
  const [activityOpen, setActivityOpen] = useState(true);
  const [attendance, setAttendance] = useState({});'''
          if old not in text:
              raise SystemExit('Attendance state block not found')
          text = text.replace(old, new, 1)

          old = '''        <label>Actividad</label>
        <ActivityPicker value={activityType} onChange={setActivityType} />
        {activityType === "match" && ('''
          new = '''        <label>Actividad</label>
        <ActivityPicker
          value={activityType}
          open={activityOpen}
          onToggle={() => setActivityOpen((open) => !open)}
          onChange={(nextType) => {
            setActivityType(nextType);
            setActivityOpen(true);
          }}
        />
        {activityOpen && activityType === "match" && ('''
          if old not in text:
              raise SystemExit('Attendance picker block not found')
          text = text.replace(old, new, 1)

          old = '''        {activityType === "tournament" && (
          <div className="event-extra event-grid">'''
          new = '''        {activityOpen && activityType === "tournament" && (
          <div className="event-extra event-grid">'''
          if old not in text:
              raise SystemExit('Tournament block not found')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          css = Path('src/styles.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* TEMP_INTERFACE_FIX_MARKER */'
          if marker not in css_text:
              css_text += '''

/* TEMP_INTERFACE_FIX_MARKER */
.app > nav {
  flex-wrap: nowrap !important;
  white-space: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  width: 100%;
}
.app > nav button {
  flex: 0 0 auto !important;
  white-space: nowrap;
}
'''
              css.write_text(css_text, encoding='utf-8')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'src/App.jsx', 'src/styles.css'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: toggle activity details and keep navigation on one row'], check=True)
          subprocess.run(['git', 'push'], check=True)
          PY
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/interface-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary interface workflow'
          git push
