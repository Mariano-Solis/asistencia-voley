name: Build VOLEY PRUEBA APK

on:
  push:
    branches:
      - feature/courtrack-standings
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VOLEY-PRUEBA-Posiciones.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOLEY-PRUEBA-Posiciones
          path: VOLEY-PRUEBA-Posiciones.apk
          if-no-files-found: error
          retention-days: 7
